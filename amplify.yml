# Amplify Hosting build spec for meetligo.com (Next.js, SSR).
#
# Why this file exists: Amplify exposes console environment variables to the
# BUILD, not to the Next.js server at RUNTIME. Anything a server route reads
# with process.env has to be copied into .env.production during the build, or
# the running site never sees it. That is how LIGO_INTAKE_KEY sat "present and
# correctly named" in the console through four rebuilds while the site kept
# reporting it missing (9/10/2026). Every variable src/ reads is listed here;
# add new ones to this line when the code starts reading them.
# NEXT_PUBLIC_GA_MEASUREMENT_ID (2026-09-16): the GA4 property ID, read at build
# time by src/app/layout.tsx; no ID, no tag.
# SLACK_CAREERS_WEBHOOK (2026-09-18): Slack Incoming Webhook for the careers
# channel, read at runtime by src/lib/slack.ts. Unset is a supported state: the
# site behaves exactly as it did before, minus the Slack post.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22 || nvm install 22 || true
        - npm ci
    build:
      commands:
        - env | grep -e SENDGRID_API_KEY -e SENDGRID_FROM_EMAIL -e LIGO_INTAKE_KEY -e LIGO_CAREERS_KEY -e SLACK_CAREERS_WEBHOOK -e NEXT_PUBLIC_GA_MEASUREMENT_ID >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
